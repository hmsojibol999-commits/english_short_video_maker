name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - work/learning-modes-auto-images

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile engine/*.py

      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/core.js

      - name: Run browser-core tests
        run: node --test tests/test_core.js
